[project]
name = "spektrafilm-benchmark"
version = "0.1.0"
description = "CLI appearance benchmarks and offline reviews for SpektraFilm"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "Pillow>=11,<13",
  "pypng>=0.20220715.0,<1",
  "scipy>=1.15,<2",
  "colour-science>=0.4.6,<0.5",
  "tifffile>=2025.1",
  "flip-evaluator>=1.7,<2",
  "jsonschema>=4.23,<5",
]

[project.scripts]
spektrafilm-bench = "spektrafilm_bench:main"
spektrafilm-bench-fixtures = "fixtures:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["spektrafilm_bench", "documents", "schemas", "image_data", "metrics", "report", "report_assets", "references", "icc", "fixtures", "png16"]
packages = ["spektrafilm_benchmark_assets"]

[tool.setuptools.package-data]
spektrafilm_benchmark_assets = ["*.json"]
