# --- defaults
[defaults.bw.negative] # roughly modeled after kodak_doublex
rms_granularity = [14.0]
uniformity = [0.6]
density_min = [0.01]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.bw.positive] # roughly modeled after kodak_trix
rms_granularity = [44.0]
uniformity = [0.6]
density_min = [0.003]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.color.negative] # roughly modeled after kodak_vision3_50d
rms_granularity = [7.0, 7.0, 12.0]
uniformity = [0.97, 0.97, 0.97]
density_min = [0.03, 0.03, 0.03]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.color.positive]
rms_granularity = [7.0, 7.0, 12.0]
uniformity = [0.97, 0.97, 0.97]
density_min = [0.03, 0.03, 0.03]
particle_scale_sublayers = [1.0, 0.4, 0.25]


# --- still color
#
# Relative per-channel Dye strength, not certified optical RMS targets.
# Some channel ratios below come from commercial film-simulation outputs,
# normalized to green; the existing green magnitudes remain unchanged.
# These are valid appearance references, not film-material measurements.
# Other entries and the default `channel_correlation` retain their existing
# values; these choices do not identify material ratios or scanner causality.
#
# Source names below identify appearance references. Entries marked "same
# class" map by stock class, not exact stock identity. Runtime semantics and
# evidence limits are documented in docs/grain.md#field-controls; that section
# is not a source dataset or a provenance record for these ratios.
[kodak_gold_200] # KodakEliteColor200, same class
rms_granularity = [3.765, 5.0, 4.9]

[kodak_ultramax_400] # KodakEliteColor400, same class
rms_granularity = [5.088, 6.0, 8.388]

[kodak_ektar_100] # KodakEktar100
rms_granularity = [3.756, 4.0, 7.536]

[kodak_portra_160] # Portra160NC/VC median
rms_granularity = [2.919, 3.5, 4.284]

[kodak_portra_400] # KodakPortra400
rms_granularity = [5.6385, 4.5, 5.544]

# Reference stock for Dye's relative scale: `k_c = (G_c / 6)^2 = 1` here keeps
# the configured `v3_event_area_um2`, not a validated absolute material area.
# The reference stock and its pushes retain uniform channel presets.
[kodak_portra_800]
rms_granularity = [6.0, 6.0, 6.0]

[kodak_portra_800_push1]
rms_granularity = [7.0, 7.0, 7.0]

[kodak_portra_800_push2]
rms_granularity = [9.0, 9.0, 9.0]

[fujifilm_c200] # FujiSuperia200, same class
rms_granularity = [4.092, 4.0, 2.108]

[fujifilm_xtra_400] # FujiSuperiaXtra400
rms_granularity = [3.456, 4.0, 5.564]

[fujifilm_pro_400h] # FujiPro400H
rms_granularity = [6.132, 4.0, 9.392]


