name: Release

# Formal release from a version tag. The gate job proves the tag sits on
# main-0.3.4 and matches the workspace version, then the shared three-platform
# build attaches the packages to the GitHub Release. Manual dispatch packages
# the current commit without attaching, for packaging smoke runs. Nightly
# packages from verified main commits come from ci.yml.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# One release run per ref at a time. A run started while another run is active
# stays pending, and a newer queued run replaces it, so successive commits
# collapse into a single run of the newest commit. The active run is never
# cancelled, and each tag keeps its own group so no tag release is dropped.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry needs the full history: a depth-1 tag fetch cannot prove
          # that the tag commit is contained in main-0.3.4.
          fetch-depth: 0
      - name: Verify the tag sits on main-0.3.4
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin main-0.3.4
          if ! git merge-base --is-ancestor HEAD origin/main-0.3.4; then
            echo "::error::${GITHUB_REF_NAME} is not contained in main-0.3.4; release only from an integrated commit" >&2
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is contained in main-0.3.4"
      - name: Verify the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          # Every crate inherits version.workspace, so the metadata versions
          # must be unique and equal to the tag; a disagreement is a
          # release-blocking inconsistency.
          actual=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | join(",")')
          if [ "$actual" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${actual}" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace version ${actual}"
      - name: Report the manual dispatch path
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual dispatch: packaging ${GITHUB_REF_NAME} without release attachment."

  packages:
    name: Build packages
    needs: gate
    # A called workflow takes the GITHUB_TOKEN permissions from the calling
    # job, not the workflow level; the release attachment needs write here.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      attach_release: true
