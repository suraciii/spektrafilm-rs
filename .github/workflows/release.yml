name: Release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - migration/integration
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Install package smoke dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python image bindings
        run: python -m pip install numpy OpenImageIO exiv2 colour-science==0.4.7
      - name: Install native toolchain and dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-lensfun
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-openimageio

      - name: Install matching Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-gnu

      - name: Package native application
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
          $env:CARGO_BUILD_TARGET = "x86_64-pc-windows-gnu"
          $env:CC = "gcc"
          $env:CXX = "g++"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = "gcc"
          $env:PKG_CONFIG_PATH = "C:\msys64\ucrt64\lib\pkgconfig"
          $env:PKG_CONFIG_ALLOW_CROSS = "1"
          $env:SPEKTRAFILM_NATIVE_PREFIX = "C:\msys64\ucrt64"
          $env:SPEKTRAFILM_RELEASE_SUBDIR = "x86_64-pc-windows-gnu\release"
          pkg-config --atleast-version=0.22.0 libraw
          if ($LASTEXITCODE -ne 0) { throw "Release RAW decoder requires LibRaw >= 0.22.0" }
          cargo test --workspace --features precision-f64
          if ($LASTEXITCODE -ne 0) { throw "Workspace tests failed" }
          ./scripts/package_windows_app.ps1 -DistDir "dist\spektrafilm-windows-x64"
          python scripts/parity/package_smoke.py --cli dist/spektrafilm-windows-x64/spektrafilm.exe --raw-helper dist/spektrafilm-windows-x64/decode_raw_gui.exe --gui dist/spektrafilm-windows-x64/spektrafilm-gui.exe --data-dir dist/spektrafilm-windows-x64/data --evidence-dir "$env:RUNNER_TEMP/package-smoke"
          if ($LASTEXITCODE -ne 0) { throw "Package smoke failed" }

      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-windows-x64
          path: ${{ runner.temp }}/package-smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-windows-x64
          path: dist/spektrafilm-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spektrafilm-windows-x64.zip

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package smoke dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python image bindings
        run: python -m pip install numpy OpenImageIO exiv2 colour-science==0.4.7

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential patchelf pkg-config curl ca-certificates \
            libgtk-3-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0 \
            liblensfun-dev libexiv2-dev libglib2.0-dev libopenimageio-dev \
            libjpeg-dev zlib1g-dev liblcms2-dev libopenblas-dev xvfb xauth

      - name: Build pinned LibRaw 0.22.0
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/libraw-022"
          curl -fsSL --retry 3 -o LibRaw-0.22.0.tar.gz \
            https://www.libraw.org/data/LibRaw-0.22.0.tar.gz
          echo "1071e6e8011593c366ffdadc3d3513f57c90202d526e133174945ec1dd53f2a1  LibRaw-0.22.0.tar.gz" | sha256sum -c -
          tar -xzf LibRaw-0.22.0.tar.gz
          cd LibRaw-0.22.0
          ./configure --prefix="$prefix" --disable-static
          make -j"$(nproc)"
          make install
          mkdir -p "$prefix/share/doc/libraw"
          cp COPYRIGHT LICENSE.CDDL LICENSE.LGPL "$prefix/share/doc/libraw/"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libraw-022/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          cargo build --release -p spektrafilm-gui
          cargo build --release -p spektrafilm-cli --bin spektrafilm --bin decode_raw_gui
          cargo build --release -p spektrafilm-cli --bin spektrafilm-f64 --features precision-f64
          LD_LIBRARY_PATH="$RUNNER_TEMP/libraw-022/lib:${LD_LIBRARY_PATH:-}" cargo test --workspace --features precision-f64

      - name: Package portable directory
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/libraw-022/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          BUILD_TARGET_DIR=target RELEASE_SUBDIR=release \
            bash scripts/package_linux_app.sh
          xvfb-run -a python scripts/parity/package_smoke.py --cli dist/spektrafilm-linux-x64/bin/spektrafilm --raw-helper dist/spektrafilm-linux-x64/bin/decode_raw_gui --gui dist/spektrafilm-linux-x64/bin/spektrafilm-gui --data-dir dist/spektrafilm-linux-x64/share/data --evidence-dir "$RUNNER_TEMP/package-smoke"

      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-linux-x64
          path: ${{ runner.temp }}/package-smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-linux-x64
          path: dist/spektrafilm-linux-x64.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spektrafilm-linux-x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package smoke dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python image bindings
        run: python -m pip install numpy OpenImageIO exiv2 colour-science==0.4.7

      - name: Install native dependencies
        shell: bash
        run: |
          brew install libraw lensfun exiv2 glib openimageio pkg-config
          pkg-config --atleast-version=0.22.0 libraw

      - name: Package app bundle
        shell: bash
        run: |
          cargo test --workspace --features precision-f64
          bash scripts/package_macos_app.sh
          python scripts/parity/package_smoke.py --cli dist/spektrafilm-macos/Spektrafilm.app/Contents/MacOS/spektrafilm --raw-helper dist/spektrafilm-macos/Spektrafilm.app/Contents/MacOS/decode_raw_gui --gui dist/spektrafilm-macos/Spektrafilm.app/Contents/MacOS/spektrafilm-gui --data-dir dist/spektrafilm-macos/Spektrafilm.app/Contents/Resources/data --evidence-dir "$RUNNER_TEMP/package-smoke"

      - name: Preserve package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-macos
          path: ${{ runner.temp }}/package-smoke

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spektrafilm-macos
          path: dist/spektrafilm-macos.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/spektrafilm-macos.zip
