name: Native GUI acceptance

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Native scenario scope (full includes every acceptance assertion)
        type: choice
        default: full
        options:
          - full
          - chooser
          - export
          - viewer
          - cancel
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: native-gui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-gui:
    name: Linux native GUI (${{ inputs.scenario || 'full' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SCENARIO: ${{ inputs.scenario || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare evidence and native library paths
        run: |
          mkdir -p "$RUNNER_TEMP/native-gui"
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/native-gui" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libraw-022/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libraw-022/lib" >> "$GITHUB_ENV"
      - name: Install native build and desktop dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config curl ca-certificates \
              libgtk-3-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-0 \
              liblensfun-dev libexiv2-dev libglib2.0-dev libopenimageio-dev \
              libjpeg-dev zlib1g-dev libopenblas-dev \
              libvulkan1 mesa-vulkan-drivers \
              xvfb xauth dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk \
              openbox xdotool x11-utils xclip zenity tesseract-ocr ffmpeg
          } 2>&1 | tee "$EVIDENCE_ROOT/native-dependencies.log"
      - name: Install pinned native driver dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==2.4.0' 'OpenImageIO==3.1.11.0' 'Pillow==12.3.0' \
            'mss==10.2.0' 'pytesseract==0.3.13' 'psutil==7.2.2' 'exiv2==0.19.2' \
            2>&1 | tee "$EVIDENCE_ROOT/python-dependencies.log"
      - name: Cache pinned LibRaw
        id: libraw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libraw-022
          key: libraw-0.22.0-ubuntu-24.04-${{ runner.arch }}-v1
      - name: Build pinned LibRaw 0.22.0
        if: steps.libraw.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            curl -fsSL --retry 3 -o LibRaw-0.22.0.tar.gz \
              https://www.libraw.org/data/LibRaw-0.22.0.tar.gz
            echo "1071e6e8011593c366ffdadc3d3513f57c90202d526e133174945ec1dd53f2a1  LibRaw-0.22.0.tar.gz" | sha256sum -c -
            tar -xzf LibRaw-0.22.0.tar.gz
            cd LibRaw-0.22.0
            ./configure --prefix="$RUNNER_TEMP/libraw-022" --disable-static --disable-examples
            make -j"$(nproc)"
            make install
          } 2>&1 | tee "$EVIDENCE_ROOT/libraw-build.log"
      - name: Build native binaries with source evidence
        run: |
          set -euo pipefail
          python -B scripts/build_evidence.py --out-dir "$EVIDENCE_ROOT/build" \
            --profile release --require-clean 2>&1 | tee "$EVIDENCE_ROOT/build.log"
      - name: Run native GUI scenario on an isolated desktop
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1100x24' dbus-run-session -- bash -euo pipefail -c '
            export XDG_CURRENT_DESKTOP=GNOME
            export XDG_SESSION_TYPE=x11
            dbus-update-activation-environment DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
            /usr/libexec/xdg-desktop-portal-gtk > "$EVIDENCE_ROOT/portal-gtk.log" 2>&1 &
            /usr/libexec/xdg-desktop-portal > "$EVIDENCE_ROOT/portal.log" 2>&1 &
            python -B scripts/parity/gui_acceptance.py \
              --build-manifest "$EVIDENCE_ROOT/build/manifest.json" \
              --scenario "$SCENARIO" --evidence-dir "$EVIDENCE_ROOT/acceptance"
          ' 2>&1 | tee "$EVIDENCE_ROOT/desktop.log"
      - name: Preserve native evidence, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-gui-${{ inputs.scenario || 'full' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-gui
          if-no-files-found: warn
          retention-days: 14
