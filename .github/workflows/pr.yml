name: PR checks

# Pull request gate only, fast by design: formatting, Python cache checks, and
# the pure-math test profile. The full verification gate and the three-platform
# package build run post-merge in ci.yml; formal releases run from release.yml
# on version tags. See docs/building.md.

on:
  pull_request:
    branches: [main-0.3.4]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    name: PR lightweight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CARGO_TARGET_DIR: target/pr-lightweight
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Identify Rust cache environment
        id: rust-environment
        run: echo "version=$(rustc -V | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore lightweight math cache
        uses: actions/cache@v4
        with:
          path: target/pr-lightweight
          key: pr-math-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-environment.outputs.version }}-${{ hashFiles('Cargo.lock', 'crates/spektrafilm-math/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            pr-math-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-environment.outputs.version }}-${{ hashFiles('Cargo.lock', 'crates/spektrafilm-math/Cargo.toml') }}-
            pr-math-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-environment.outputs.version }}-
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run fast PR gate with evidence
        run: just verify-pr "$RUNNER_TEMP/verification"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
