name: PR checks

on:
  pull_request:
    branches: [main-0.3.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: PR lightweight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure native library paths
        run: |
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libraw-022/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/libraw-022/lib" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl ca-certificates \
            libgtk-3-dev libudev-dev libxkbcommon-dev \
            liblensfun-dev libexiv2-dev libglib2.0-dev libopenimageio-dev \
            libjpeg-dev zlib1g-dev libopenblas-dev \
            libvulkan1 mesa-vulkan-drivers
      - name: Cache pinned LibRaw
        id: libraw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libraw-022
          key: libraw-0.22.0-ubuntu-24.04-${{ runner.arch }}-v1
      - name: Build pinned LibRaw 0.22.0
        if: steps.libraw.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o LibRaw-0.22.0.tar.gz \
            https://www.libraw.org/data/LibRaw-0.22.0.tar.gz
          echo "1071e6e8011593c366ffdadc3d3513f57c90202d526e133174945ec1dd53f2a1  LibRaw-0.22.0.tar.gz" | sha256sum -c -
          tar -xzf LibRaw-0.22.0.tar.gz
          cd LibRaw-0.22.0
          ./configure --prefix="$RUNNER_TEMP/libraw-022" --disable-static --disable-examples
          make -j"$(nproc)"
          make install
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Run and time fast Python checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/python-checks"
          # Incremental target: 30 seconds including Ruff installation.
          # Keep timing evidence even when installation or a check fails.
          started=$SECONDS
          trap 'printf "fast_python_elapsed_seconds=%s target_seconds=30\n" "$((SECONDS - started))" | tee "$RUNNER_TEMP/python-checks/timing.txt"' EXIT
          {
            python3 -m pip install --disable-pip-version-check --no-deps -r scripts/requirements-check.txt
            just check-python test-gui-driver
          } 2>&1 | tee "$RUNNER_TEMP/python-checks/checks.log"
      - name: Run the full gate with evidence
        run: just verify "$RUNNER_TEMP/verification"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            ${{ runner.temp }}/verification
            ${{ runner.temp }}/python-checks
          if-no-files-found: error
