name: Main CI

on:
  push:
    branches: [main-0.3.4]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Diagnose restored Cargo builds
    runs-on: ubuntu-24.04
    concurrency:
      group: main-verify-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # Type checks and the parity example do not need debug symbols in CI.
      CARGO_PROFILE_DEV_DEBUG: '0'
    container:
      image: ghcr.io/suraciii/spektrafilm-verification@sha256:701bc91921c05fbaeff92e66e7f76cd2ef1517c5333200dd3cdcfff3de57bf13
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        id: environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          cat /opt/verification/tools.txt
          echo "identity=8d4afdd3e1fe78a13ff552e66c6c2cb9bdce92871cf27d4c9ff242931e205cb5" >> "$GITHUB_OUTPUT"
          vulkaninfo --summary
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('Cargo.lock') }}-
            verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-
      - name: Run full main gate with evidence
        id: gate
        env:
          CARGO_LOG: cargo::compiler::fingerprint=info
        run: |
          mkdir -p "$RUNNER_TEMP/verification"
          { time cargo test --locked --workspace --no-run; } 2>&1 | tee "$RUNNER_TEMP/verification/workspace.log"
          { time cargo test --locked -p spektrafilm-gpu --lib --no-run; } 2>&1 | tee "$RUNNER_TEMP/verification/gpu.log"
          { time cargo test --locked -p spektrafilm-gpu --lib --features precision-f64 --no-run; } 2>&1 | tee "$RUNNER_TEMP/verification/gpu-f64.log"
          { time cargo test --locked -p spektrafilm-core --lib --features precision-f64 --no-run; } 2>&1 | tee "$RUNNER_TEMP/verification/core-f64.log"
      - name: Preserve verification evidence
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
