name: Main CI

on:
  push:
    branches: [main-0.3.4]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Main full verification
    runs-on: ubuntu-24.04
    concurrency:
      group: main-verify-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      # Type checks and the parity example do not need debug symbols in CI.
      CARGO_PROFILE_DEV_DEBUG: '0'
    container:
      image: ghcr.io/suraciii/spektrafilm-verification@sha256:701bc91921c05fbaeff92e66e7f76cd2ef1517c5333200dd3cdcfff3de57bf13
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record environment
        id: environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          cat /opt/verification/tools.txt
          echo "identity=$(cat .github/ci/Dockerfile .github/workflows/ci.yml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          vulkaninfo --summary
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          # Keep this key source-independent: Cargo fingerprints invalidate
          # changed crates, while dependencies and unchanged artifacts stay warm.
          key: verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-${{ hashFiles('Cargo.lock') }}-
            verification-container-v1-${{ runner.arch }}-${{ steps.environment.outputs.identity }}-
      - name: Run full main gate with evidence
        id: gate
        run: just verify "$RUNNER_TEMP/verification"
      - name: Preserve verification evidence
        if: always() && steps.gate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/verification
          if-no-files-found: error
      - name: Save Cargo cache
        if: always() && steps.gate.outcome != 'skipped' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  packages:
    name: Build packages
    needs: verify
    concurrency:
      group: main-packages-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      attach_release: false
