[package]
name = "spektrafilm-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "spektrafilm-bench"

[[bin]]
name = "spektrafilm-bench"
path = "src/bin/bench.rs"

[dependencies]
spektrafilm-math.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg", "webp", "gif"] }
rustfft.workspace = true
sha2 = "0.10"
ryu = "1"
tiff = "0.10"
png = "0.18"
ureq = "3"
jsonschema = { version = "0.33", default-features = false }
libloading = "0.8"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
