[package]
name = "spektrafilm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "spektrafilm"
[[bin]]
name = "spektrafilm"
path = "src/main.rs"

[[bin]]
name = "spektrafilm-f64"
path = "src/bin/spektrafilm-f64.rs"
required-features = ["precision-f64"]

[[bin]]
name = "decode_raw_gui"
path = "src/bin/decode_raw_gui.rs"

[features]
# Package-wide: selecting this feature recompiles every bin in this package at
# f64. Build the reference with `--bin spektrafilm-f64`; the production
# `spektrafilm` target is f32 in normal builds.
precision-f64 = [
    "spektrafilm-math/precision-f64",
    "spektrafilm-backend/precision-f64",
    "spektrafilm-core/precision-f64",
    "spektrafilm-gpu/precision-f64",
    "spektrafilm-raw/precision-f64",
    "dep:spektrafilm-lab",
    "spektrafilm-lab/precision-f64",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-backend.workspace = true
spektrafilm-math.workspace = true
spektrafilm-raw.workspace = true
clap.workspace = true
toml = "0.8"
image.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
tiff = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# The instrument crate carries the evaluation and reporting command surface the
# f64 build exposes. The library itself is renderer-independent and math-only, so
# linking it adds no renderer dependency to this binary.
spektrafilm-lab = { path = "../spektrafilm-lab", optional = true }

# The workspace `image` dependency is PNG-only. These suites decode the
# TIFF/EXR artifacts the CLI writes, so the test target restores those
# decoders without widening the production feature set.
# The workspace `image` dependency is PNG-only. These suites decode the
# TIFF/EXR artifacts the CLI writes, so the test target restores those
# decoders without widening the production feature set.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
