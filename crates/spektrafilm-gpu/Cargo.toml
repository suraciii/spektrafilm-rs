[package]
name = "spektrafilm-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu"]
precision-f64 = ["spektrafilm-math/precision-f64", "spektrafilm-backend/precision-f64"]

[dependencies]
spektrafilm-backend.workspace = true
spektrafilm-math.workspace = true
tracing.workspace = true
wgpu = { workspace = true, optional = true, features = ["wgsl", "counters"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
parking_lot = "0.12"

[dev-dependencies]
# Exercise the vendored Vulkan writer patch without creating a device.
naga = { version = "24.0.0", features = ["wgsl-in", "spv-out"] }
tracing-subscriber = { workspace = true }
# Device tests compare the shader against the CPU reference, which lives in
# the model crate. A dev-dependency keeps the library's acyclic build graph
# while letting the tests reach the reference implementations.
spektrafilm-model.workspace = true
# The preview resample parity test compares the device kernel against the
# reference `image::imageops::resize(Triangle)` call the preview uses.
image.workspace = true

[lints]
workspace = true
