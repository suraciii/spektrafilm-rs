[package]
name = "spektrafilm-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu"]
precision-f64 = ["spektrafilm-math/precision-f64", "spektrafilm-backend/precision-f64"]

[dependencies]
spektrafilm-backend.workspace = true
spektrafilm-math.workspace = true
tracing.workspace = true
wgpu = { workspace = true, optional = true, features = ["wgsl"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
parking_lot = "0.12"

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
