[package]
name = "spektrafilm-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SpektraFilm measurement instrument: analysis, comparison, and reporting"
build = "build.rs"

[features]
default = []
precision-f64 = ["spektrafilm-math/precision-f64"]

[[bin]]
name = "spektrafilm-lab"
path = "src/main.rs"
required-features = ["precision-f64"]

[dependencies]
spektrafilm-math.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg", "webp", "gif"] }
rustfft.workspace = true
sha2 = "0.10"
ryu = "1"
tiff = "0.10"
png = "0.18"
jsonschema = { version = "0.33", default-features = false }
libloading = "0.8"
anyhow.workspace = true
exr = "1.73"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[lints]
workspace = true
