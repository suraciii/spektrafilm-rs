[package]
name = "spektrafilm-backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
precision-f64 = ["spektrafilm-math/precision-f64"]

[dependencies]
spektrafilm-math.workspace = true
rayon.workspace = true
tracing.workspace = true
serde.workspace = true
parking_lot = "0.12"
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native BLAS for CPU spectral integration — matches numpy's
# Accelerate-backed einsum bit-exactly on macOS.
cblas = "0.4"
blas-src = { version = "0.10", features = ["accelerate"] }
accelerate-src = "0.3"

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"], default-features = false }

[lints]
workspace = true
