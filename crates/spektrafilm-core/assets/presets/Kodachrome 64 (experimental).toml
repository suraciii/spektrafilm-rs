# Kodachrome 64 (experimental)
# Single schema-7 K64 look for the shipped kodak_kodachrome_64 profile.
# The profile uses the pre-E-88 upstream curves with a narrowed magenta dye and a
# local M/Y curve re-anchor; this preset adds the rich black point and saturation.
# Hanatos surface adaptation is off.
# Grain is Dye 1.25 / scale 4.0; chemistry, halation and DIR are off.
# Experimental: no perceptual panel has been run; not a calibrated K-14 reconstruction.

schema_version = 7

name = "Kodachrome 64 (experimental)"
author = "SpektraFilm"
description = "Single experimental Kodachrome 64 look: magenta-narrowed pre-E-88 curves with a local M/Y re-anchor, a deep black point (expand black 0.02 / white 1.02) and saturation 0.4 for a richer, denser palette. Grain strength 1.25 and scale 4.0; chemistry, halation and DIR are off. Experimental: no perceptual panel has been run; this is not a K-14 reconstruction or a calibrated scanner profile."

[parameters.camera]
auto_exposure = false
auto_exposure_method = "center_weighted"
exposure_compensation_ev = 0.40

[parameters.finishing]
brightness = 0.0
contrast = 0.0
warmth = 0.0
saturation = 0.4
[parameters.finishing.expand]
enabled = true
black = 0.02
white = 1.02
[film_profile]
stock = "kodak_kodachrome_64"
version = "0.3.4"

[print_profile]
stock = "kodak_portra_endura"
version = "0.3.4"

[parameters.output_mix]
amount = 1.0

[parameters.settings]
apply_hanatos2025_adaptation_surface = false

[parameters.enlarger]
illuminant = "TH-KG3"
print_exposure = 1.0
print_exposure_mode = "auto"
y_filter_shift = 0.0
m_filter_shift = 0.0
preflash_exposure = 0.0
preflash_y_filter_shift = 0.0
preflash_m_filter_shift = 0.0

[parameters.enlarger.diffusion_filter]
