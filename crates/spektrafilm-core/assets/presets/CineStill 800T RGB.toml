description = "Experimental RGB appearance companion to the CineStill 800T Film preset. It carries a strong HDR-facing halation with a broad red response; the maximum-channel mask is a separate RGB model. Its default high protection extends above HDR lamp highlights so the look responds to the source; the pair is an appearance relationship, not a measured equivalence claim."

