schema_version = 9

name = "CineStill 800T RGB"
author = "SpektraFilm"
description = "Optional RGB appearance preset paired with the CineStill 800T Film preset. It is not the stock-agnostic engine default. The preset starts from a moderate local red response: 110 µm, a 0.15 source limiter, and strength [0.25, 0.075, 0.008]. High protection extends above HDR lamp highlights. The maximum-channel mask and one common compositing guard are a separate RGB model. The pair is an appearance relationship, not a measured equivalence claim; stronger variants are available through the Radius and Intensity controls."

[provenance]
implementation_version = "0.1.6"
model_version = "spektrafilm"

[effects.halation]
active = true
mask_low = 0.15
mask_high = 8.0
mask_transition = 0.0834
sigma_um = [110.0, 110.0, 110.0]
strength = [0.25, 0.075, 0.008]
n_bounces = 3
bounce_decay = 0.5

[effects.diffusion]
active = false

[effects.grain]
active = false
