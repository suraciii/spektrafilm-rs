author = "SpektraFilm"
description = "Classic Neg. inspired consumer print look with X-Tra 400, Crystal Archive Type II, tone-dependent color separation, original-strength Spektra grain, and restrained class-level halation. Independently authored, not an official Fujifilm match. Adjust print exposure for each photograph; lower values make the print lighter."
