[package]
name = "spektrafilm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
precision-f64 = [
    "spektrafilm-math/precision-f64",
    "spektrafilm-gpu/precision-f64",
    "spektrafilm-model/precision-f64",
]

[dependencies]
spektrafilm-math.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-model.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
image.workspace = true
anyhow.workspace = true
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "=0.3.36", features = ["formatting"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rustfft.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["openblas"] }
